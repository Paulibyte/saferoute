# Builds the SafeRoute Naija Android app in the cloud.
# Runs when you push changes under android-app/, when you push a tag like android-v1.0, or by hand (Actions → Build Android app → Run workflow).
# Repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   your signing key (.p12) as base64   } without these you get a debug APK
#   ANDROID_KEYSTORE_PASSWORD its password                        } that must be uninstalled before
#   ANDROID_KEY_ALIAS         the key alias (e.g. saferoute)      } each update
#   GOOGLE_SERVICES_JSON      Firebase google-services.json as base64 (optional — needed for app notifications)
name: Build Android app

on:
  workflow_dispatch:
  push:
    tags: ['android-v*']
    paths: ['android-app/**', '.github/workflows/android.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android-app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install Capacitor and plugins
        run: npm ci

      - name: Sync web config into the Android project
        run: npx cap sync android

      - name: Add Firebase config (if provided)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
            echo "Firebase config added — notifications enabled"
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret not set — this build cannot receive app notifications"
          fi

      - name: Add signing key (if provided)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/saferoute.p12"
            echo "SR_KEYSTORE_FILE=$RUNNER_TEMP/saferoute.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key secrets — building a DEBUG apk (uninstall the old app before installing each new build)"
          fi

      - name: Build
        env:
          SR_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SR_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SR_KEYSTORE_TYPE: pkcs12
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          if [ -n "$SR_KEYSTORE_FILE" ]; then
            ./gradlew --no-daemon assembleRelease bundleRelease -PversionCode=${{ github.run_number }}
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/SafeRoute-Naija-${{ github.run_number }}.apk"
            cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/SafeRoute-Naija-${{ github.run_number }}.aab"
          else
            ./gradlew --no-daemon assembleDebug -PversionCode=${{ github.run_number }}
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/SafeRoute-Naija-${{ github.run_number }}-debug.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: SafeRoute-Naija-android-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/*.apk
            ${{ runner.temp }}/*.aab
          if-no-files-found: error

      - name: Attach to a GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ runner.temp }}/*.apk
            ${{ runner.temp }}/*.aab
